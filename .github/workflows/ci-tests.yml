name: Java Regression Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JUnit
        run: |
          mkdir -p ci-libs
          curl -fL -o ci-libs/junit-platform-console-standalone.jar https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.14.4/junit-platform-console-standalone-1.14.4.jar

      - name: Compile Java code and tests
        run: |
          mkdir -p out
          find SmartBeach/src -name "*.java" > sources.txt
          javac -encoding UTF-8 -cp "ci-libs/junit-platform-console-standalone.jar" -d out @sources.txt

      - name: Run JUnit tests
        run: |
          java -jar ci-libs/junit-platform-console-standalone.jar execute --class-path out --scan-class-path --fail-if-no-tests